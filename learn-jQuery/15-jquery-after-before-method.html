<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
      body {
        font-family: arial;
      }
      #box {
        border: 2px dashed blue;
        background: lightgreen;
      }
      h2,
      p,
      h1 {
        text-align: center;
      }
      </style>
</head>
<body>
    <h1>jQuery after() before() methods</h1>
    <div id="box" class="test abc">
      <h2>Test box</h2>
      <p>
        Lorem ipsum dolor, sit <span>amet consectetur adipisicing</span> elit.
        Molestias dolor odit ea veniam porro quae
      </p>
    </div>
    <br><br><br7>
    <button id="afterbtn">After Button</button>
    <button id="beforebtn">Before Button</button>
    <script src="js/jquery-4.0.0.min.js"></script>
    <script>
        $(document).ready(function(){
            $('#afterbtn').click(function(){
                $('#box').after("<h3>After: Talha brother</h3><p>A cracker is coming on</p>");               
            });
            $('#beforebtn').click(function(){
                $('#box').before("<h3 style='text-align:center'>Before: Talha brother</h3><p style='text-align:center'>A cracker is coming on</p>");
            });
        });
        </script>
        </body>
        </html>
