<!-- set method means value ta .val er vitore message er moto kore pathai deya -->
<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Learn jQuery</title>
    <style>
      body {
        font-family: arial;
      }
      #box {
        background: #db7093;
        padding: 20px;
        border: 1px solid #000;
      }
    </style>
  </head>
  <body>
    <h1>jQuery Set Methods</h1>
    <form action="" id="sform">
      <label for="">Name</label><input type="text" name="" id="sname" /><br />
      <label for="">Class</label><input type="text" name="" id="sclass" /><br />
      <label for="">Country</label>
      <select id="scountry">
        <!-- scountry means student country, similarly for others -->
        <option value="">Choose one</option>
        <option value="India">India</option>
        <option value="Bangladesh">Bangladesh</option>
        <option value="Sri lanka">Sri Lanka</option>
        <option value="Pakistan">Pakistan</option>
      </select>
      <br /><br />
      <input type="submit" />
    </form>
    <div
      id="exam"
      style="border: 3px dashed yellowgreen; margin-top: 15px"
    ></div>
    <script src="js/jquery-4.0.0.min.js"></script>
    <script>
      $(document).ready(function(){
        $('#sname').val("Talha"); // name er ekhane type='email' dileo vulval dileo dhore
        $('#sclass').val("BSc from IUT");
        $('#scountry').val("Bangladesh");//NB: ekhane option er bairer kisu dile dhorte parbe na
      });
    </script>
    </body>
    </html>
