 <!-- 4types of get method similar to set method, text(), html(), attr(), val() -->
<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Learn jQuery</title>
    <style>
      body {
        font-family: arial;
      }
      #box {
        background: pink;
        border: 2px dashed blue;
      }
      h2,
      p,
      h1 {
        text-align: center;
      }
      .red{
        color: green;
      }
    </style>
  </head>
  <body>
    <h1>jQuery Get methods</h1>
    <div id="box" class="test abc">
      <h2>Test box</h2>
      <p>
        Lorem ipsum dolor, sit <span>amet consectetur adipisicing</span> elit.
        Molestias dolor odit ea veniam porro quae
      </p>
    </div>
    <br />
    <button id="clickbutton">Set Value</button>
    <script src="js/jquery-4.0.0.min.js"></script>
    <script>
      $(document).ready(function () {
        $("#clickbutton").click(function () {
          $("#box h2").text("Hey <b>TALHA</b>");
          $("#box p").html("Hey <b>TALHA</b>Welcome to your site.");
          $("#box p").attr("class", "green");
        });
      });
    </script>
  </body>
</html>
