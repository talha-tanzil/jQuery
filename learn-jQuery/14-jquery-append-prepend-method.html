<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Learn jQuery</title>
    <style>
      body {
        font-family: arial;
      }
      #box {
        border: 2px dashed blue;
        background: lightgreen;
      }
      h2,
      p,
      h1 {
        text-align: center;
      }
      </style>
      </head>
  <body>
    <h1>jQuery css inline methods</h1>
    <div id="box" class="test abc">
      <h2>Test box</h2>
      <p>
        Lorem ipsum dolor, sit <span>amet consectetur adipisicing</span> elit.
        Molestias dolor odit ea veniam porro quae
      </p>
    </div>
    <!-- <ol>
        <li>List Item 1</li>
        <li>List Item 2</li>
        <li>List Item 3</li>
    </ol> -->
    <br><br><br7>
    <button id="appendbtn">Append Button</button>
    <button id="prependbtn">Prepend Button</button>
    <script src="js/jquery-4.0.0.min.js"></script>
    <script>
        $(document).ready(function(){
            $('#appendbtn').click(function(){
                $('#box').append("<h3>Talha boss</h3>");
                // $('ol').append("<li>new item</li>");
            });
            $('#prependbtn').click(function(){
                $('#box').prepend("<h3 style='text-align:center'>Talha boss</h3>");
                // $('ol').prepend("<li>new item</li>");
            });
        });
        </script>
        </body>
        </html>
