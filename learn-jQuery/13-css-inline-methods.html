<!-- jscript css methods are actually css inline methods -->
 <!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Learn jQuery</title>
    <style>
      body {
        font-family: arial;
      }
      #box {
        border: 2px dashed blue;
      }
      h2,
      p,
      h1 {
        text-align: center;
      }
      </style>
      </head>
  <body>
    <h1>jQuery Get methods</h1>
    <div id="box" class="test abc">
      <h2>Test box</h2>
      <p>
        Lorem ipsum dolor, sit <span>amet consectetur adipisicing</span> elit.
        Molestias dolor odit ea veniam porro quae
      </p>
    </div>
    <br /><br /><br />
    <button id="styleButton">Add Class</button>
    <script src="js/jquery-4.0.0.min.js"></script>
    <script>
        $(document).ready(function(){
            $('#styleButton').click(function(){
                $('#box').css("background","red");// er mane single kore css value dile "property", "value" evabe likbe. kintu eki sathe koyekta css property use korle curly brace, colon & comma use hoi. it's mentioned below
                $('#box').css({"Background": "#d6b4fc", "color": "green","border": "4px dotted green"});
            });
        });
    </script>
    </body>
</html>
