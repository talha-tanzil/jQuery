<!-- VVI info: stop method sudhu 1st animation kei stop korte pare, 2nd animation ke stop korte pare na -->

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      body {
        font-family: Arial;
      }
      #box {
        background: rgb(216, 216, 188);
        height: 80px;
        width: 80px;
        padding: 10px;
        border: 2px dashed blue;
        position: relative;
      }
      h1,
      p {
        text-align: center;
      }
    </style>
  </head>
  <body>
    <h1>jQuery animate methods</h1>
    <div id="box">
      <h6>Talha's method Testing: Animate</h6>
    </div>
    <button class="animatebtn">Animate</button>
    <button class="stopbtn">Stop</button>
    <script src="js/jquery-4.0.0.min.js"></script>
    <script>
      $(document).ready(function () {
        $(".animatebtn").click(function () {
          $("#box").animate({left: '150px'}, 3000);
          $("#box").animate({fontSize: '150px'}, 2000);
        });
        $(".stopbtn").click(function () {
            // $('#box').stop(); //aita dile sudhu 1st animation stop hoi
            $('#box').stop(true); //aita dile shob animation stop hoi
            // $('#box').stop(true, true); //aita dile sob animation pause/stop hoye ekdom last e niye jai 
        });
      });
    </script>
  </body>
</html>
