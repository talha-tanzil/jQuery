<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      body {
        font-family: Arial;
      }
      #box {
        background: rgb(216, 216, 188);
        border: 2px dashed blue;
      }
      h1,
      h2,
      p {
        text-align: center;
      }
      .test {
        background: red;
      }
    </style>
  </head>
  <body>
    <h1>jQuery hide(), show() and toggle() methods</h1>
    <div id="box">
      <h1>jQuery method Testing</h1>
      <p>
        Lorem ipsum dolor sit amet consectetur adipisicing elit. Est, eaque.
      </p>
    </div>
    <button id="hidebtn">Hide</button>
    <button id="showbtn">Show</button>
    <button id="togglebtn">Toggle</button>
    <script src="js/jquery-4.0.0.min.js"></script>
    <script>
      $(document).ready(function () {
        $("#hidebtn").click(function () {
          $("#box").hide(3000, function(){
            console.log("Now it's hidden");
          });
        });
        $("#showbtn").click(function () {
            $('#box').show("fast");
        });
        $("#togglebtn").click(function () {
            $('#box').toggle();
        });
    });
    </script>
  </body>
</html>
